name: One-time CodexGPT rename integrity repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    name: Materialize reviewed rename repairs
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.ref == 'chore/rename-codexgpt-20260720' && github.actor != 'github-actions[bot]'
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply reviewed derived-authority repairs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceExact(file, oldText, newText) {
            const text = fs.readFileSync(file, 'utf8');
            if (!text.includes(oldText)) {
              if (text.includes(newText)) return;
              throw new Error(`Expected text missing in ${file}: ${oldText}`);
            }
            fs.writeFileSync(file, text.replace(oldText, newText), 'utf8');
          }

          replaceExact(
            'docs/superpowers/plans/2026-07-14-codexgpt-self-test-output-schema.md',
            '> Design: `docs/superpowers/specs/2026-07-14-codexgpt-self-test-output-schema-design.md`  ',
            '> Design: `docs/superpowers/specs/2026-07-14-codexgpt-self-test-output-schema-design.md`',
          );

          const manifestReplacements = [
            ['244f41bc50fa2183d40767707aaed86b545563ea2d810d90608ee17db5243e45', '73386160c9af621c05fe6d3599dc6313bcb403ff3e1ddea7dbf7eb7cbe2b350f'],
            ['bb24d9a5745037dcd2627ac8d4f051cd7e7b9ff1c2972cbb95aaf341ce31c522', '6eca97cf230233a22b8f02f4d21e41c489125b26162f44031baf0bdb98dab3ff'],
            ['3506524dc4a095db3cf78a3915a203ddce8e4494da6a674698a2bc72b4f93e89', '86add118977df507ae9b373b7b4b1aec8bdc42e8ea001212133f4babcbb11f66'],
          ];
          for (const [oldText, newText] of manifestReplacements) {
            replaceExact('scripts/windows-process-host-manifest.json', oldText, newText);
          }

          replaceExact(
            'scripts/windows-native-api-inventory-v1.json',
            '7516d69e0c0017d97fe9bdc1df1acecc6063f7335a3958e2da12560d74033c06',
            '0b92e49cd180db4598af3975abbfd5dc7d210bc5ac9abda2c81d147cee97ea64',
          );

          const mutationReplacements = [
            ['mkdtemp:a1eeece921f2', 'mkdtemp:1952d4205e87'],
            ['mkdtemp:87d4d233e205', 'mkdtemp:ac597ce76ac6'],
            ['mkdtemp:170e5c4d3d8f', 'mkdtemp:6387dfbd2fcd'],
            ['mkdtemp:cbbc0cbe6301', 'mkdtemp:a1fc9877d000'],
            ['writeFile:42032cc04e14', 'writeFile:1261bce522c6'],
            ['writeFile:581014c6bb91', 'writeFile:d38166b36176'],
          ];
          for (const [oldText, newText] of mutationReplacements) {
            replaceExact('test/mutation-architecture.test.mjs', oldText, newText);
          }

          replaceExact(
            'Memory.md',
            '- Workspace: `D:\\Dev\\codexgpt`; branch: `main`; package: `codexgpt@0.28.6`.',
            '- Workspace checkout path is operator-managed; publication target: `main`; package: `codexgpt@0.28.6`.',
          );
          const memoryEvidence = '- STEP-365 local adversarial verification passed active-name residual scanning, TypeScript build, repository policy, 63/63 focused naming/security/native-host/mutation/package contracts, isolated settings Smoke, diff integrity, and the 521-entry `codexgpt@0.28.6` package dry-run. One combined local Smoke attempt reached six successful components before a settings-status timeout; the isolated settings rerun passed, while the complete Ubuntu/Windows Node 20/24 exact-head matrix remains the publication authority.';
          let memory = fs.readFileSync('Memory.md', 'utf8');
          if (!memory.includes(memoryEvidence)) {
            const anchor = '- STEP-363 cleanup removed 157 obsolete terminal runs with zero failures; the final explicit scan retained 20 runs and found zero owned-temp candidates, invalid paths, failed deletions, or interrupted claims. Build, policy, diff, mutation inventory, and the 521-entry package dry-run passed.';
            if (!memory.includes(anchor)) throw new Error('Memory verification anchor missing');
            memory = memory.replace(anchor, `${anchor}\n${memoryEvidence}`);
            fs.writeFileSync('Memory.md', memory, 'utf8');
          }

          const archiveAddendum = `\n\n**Adversarial verification addendum:**\n\n- The materialized branch exposed rename-induced integrity drift rather than runtime feature drift: three manifest-bound native-host file hashes, one semantic native-API inventory digest, and six exact mutation-review call digests changed because the canonical namespace changed inside reviewed source strings.\n- Updated only those derived authorities after inspecting each affected source operation. Repository policy then passed, and the focused naming/authentication/package/operational/native-host/mutation suite passed 63/63.\n- Active tracked paths and UTF-8 text outside append-only archives contain no residual previous project identifier. \`git diff --check\`, TypeScript build, isolated settings Smoke, and the 521-entry \`codexgpt@0.28.6\` package dry-run passed.\n- A combined local Smoke run passed analysis, analysis CLI, protected main, HTTP, Pro CLI, and doctor components before one settings runtime-status timeout. The isolated settings Smoke immediately passed; the complete exact-head CI matrix remains required to distinguish local timing noise from a portable defect.\n`;
          const archivePath = 'docs/memory/archive/interphase-maintenance-part-2.md';
          const archive = fs.readFileSync(archivePath, 'utf8');
          if (!archive.includes('**Adversarial verification addendum:**')) {
            fs.appendFileSync(archivePath, archiveAddendum, 'utf8');
          }
          NODE

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Memory.md docs/memory/archive/interphase-maintenance-part-2.md docs/superpowers/plans/2026-07-14-codexgpt-self-test-output-schema.md scripts/windows-process-host-manifest.json scripts/windows-native-api-inventory-v1.json test/mutation-architecture.test.mjs
          git diff --cached --quiet && { echo "No repair changes produced"; exit 1; }
          git commit -m "fix: repair CodexGPT rename integrity metadata"
          git push origin "HEAD:${TARGET_BRANCH}"
