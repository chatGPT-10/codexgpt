name: One-time CodexGPT canonical rename

on:
  push:
    branches:
      - chore/rename-codexgpt-20260720

permissions:
  contents: write

jobs:
  rename:
    name: Rename project surfaces
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply canonical rename
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { TextDecoder } from 'node:util';

          const workflowPath = '.github/workflows/rename-codexgpt.yml';
          const archivePrefix = 'docs/memory/archive/';
          const decoder = new TextDecoder('utf-8', { fatal: true });
          const rename = (value) => value.replace(/codexpro/gi, (match) => {
            if (match === match.toUpperCase()) return 'CODEXGPT';
            if (match === match.toLowerCase()) return 'codexgpt';
            return 'CodexGPT';
          });

          const tracked = execFileSync('git', ['ls-files', '-z'])
            .toString('utf8')
            .split('\0')
            .filter(Boolean);

          for (const file of tracked) {
            if (file.startsWith(archivePrefix)) continue;
            const bytes = fs.readFileSync(file);
            if (bytes.includes(0)) continue;
            let text;
            try {
              text = decoder.decode(bytes);
            } catch {
              continue;
            }
            const next = rename(text);
            if (next !== text) fs.writeFileSync(file, next, 'utf8');
          }

          const renameCandidates = tracked
            .filter((file) => !file.startsWith(archivePrefix))
            .map((oldPath) => ({ oldPath, newPath: rename(oldPath) }))
            .filter(({ oldPath, newPath }) => oldPath !== newPath)
            .sort((a, b) => b.oldPath.length - a.oldPath.length);

          for (const { oldPath, newPath } of renameCandidates) {
            fs.mkdirSync(path.dirname(newPath), { recursive: true });
            execFileSync('git', ['mv', '--', oldPath, newPath], { stdio: 'inherit' });
          }

          let memory = fs.readFileSync('Memory.md', 'utf8');
          memory = memory.replace(/- Date: .*?\./, '- Date: 2026-07-20.');
          const identityLine = '- Canonical project identity is CodexGPT: package, CLI, environment variables, state directories, MCP tools, source paths, tests, and active documentation use the CodexGPT name.';
          if (!memory.includes(identityLine)) {
            memory = memory.replace(
              /(- GitHub repository and `origin`: `chatGPT-10\/codexgpt` over HTTPS\.\r?\n)/,
              `$1${identityLine}\n`,
            );
          }
          const recent = '- **STEP-365 - Canonical CodexGPT rename:** replace the previous project name across active package, CLI, environment, state, tool, source, test, and documentation surfaces; preserve append-only historical archives and record the correction here.';
          if (!memory.includes(recent)) {
            memory = memory.replace('## Recent summaries\n', `## Recent summaries\n\n${recent}\n`);
          }
          fs.writeFileSync('Memory.md', memory, 'utf8');

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const changelogEntry = '- **Breaking:** Renamed every canonical package, CLI, environment-variable, local-state, MCP-tool, source-path, test, and active-documentation surface to CodexGPT. Existing installations must adopt the new package, commands, variables, and state paths.';
          if (!changelog.includes(changelogEntry)) {
            changelog = changelog.replace('## Unreleased\n', `## Unreleased\n\n${changelogEntry}\n`);
          }
          fs.writeFileSync('CHANGELOG.md', changelog, 'utf8');

          const archivePath = 'docs/memory/archive/interphase-maintenance-part-2.md';
          const archiveEntry = `\n\n## 2026-07-20 — STEP-365: Correct canonical project identity to CodexGPT\n\n**Status:** Implemented on the dedicated rename branch; pending pull-request exact-head CI.\n\n**Goal:** Correct the repository-wide canonical identity from the previous CodexPro naming to CodexGPT without silently rewriting append-only historical records.\n\n**Files changed:** All tracked active text surfaces containing the previous name, plus every active tracked filename containing it. Historical files below \`docs/memory/archive/\` remain byte-preserved except for this appended correction entry.\n\n**Implementation summary:**\n\n- Renamed the npm package, executable commands, environment-variable namespace, local state and temporary prefixes, MCP tool names, source modules, test files, documentation filenames, URLs, labels, and user-facing instructions to CodexGPT.\n- Renamed active tracked paths atomically with \`git mv\`, then updated all active textual references so imports, scripts, contracts, fixtures, and documentation remain aligned.\n- Added an active-tree residual-name gate and retained complete Ubuntu/Windows Node 20/24 pull-request CI as the publication gate.\n- This is an intentional breaking identity migration. Existing package names, commands, variables, profile/state directories, and cached MCP descriptors must be recreated or migrated under the CodexGPT namespace.\n\n**Verification:**\n\n- Pre-commit automation runs UTF-8 residual scanning outside this append-only archive, TypeScript build, repository policy, focused renamed contracts, package dry-run, and \`git diff --check\`.\n- Pull-request CI must still pass Repository policy and the Ubuntu/Windows Node 20/24 Build, Regression, Smoke, and Package matrix before merge.\n\n**Risks and limitations:**\n\n- The canonical rename intentionally breaks consumers that still invoke the previous npm package, binaries, environment variables, state paths, or MCP tool names.\n- The local checkout directory itself is outside repository version control and is not renamed by this GitHub change.\n- Historical archive entries retain the name that was accurate when those entries were written; this correction entry is the authoritative transition record.\n\n**Rollback:** Revert the STEP-365 commit. Do not partially restore mixed namespaces.\n\n**Next step:** Open the pull request, require the complete runtime matrix, repair only concrete rename regressions, and merge after exact-head success.\n`;
          const archive = fs.readFileSync(archivePath, 'utf8');
          if (!archive.includes('STEP-365: Correct canonical project identity to CodexGPT')) {
            fs.appendFileSync(archivePath, archiveEntry, 'utf8');
          }

          fs.rmSync(workflowPath);
          NODE

      - name: Reject residual active CodexPro references
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { TextDecoder } from 'node:util';

          const decoder = new TextDecoder('utf-8', { fatal: true });
          const archivePrefix = 'docs/memory/archive/';
          const files = execFileSync('git', ['ls-files', '-z'])
            .toString('utf8')
            .split('\0')
            .filter(Boolean);
          const failures = [];

          for (const file of files) {
            if (file.startsWith(archivePrefix) || !fs.existsSync(file)) continue;
            if (/codexpro/i.test(file)) failures.push(`path:${file}`);
            const bytes = fs.readFileSync(file);
            if (bytes.includes(0)) continue;
            let text;
            try {
              text = decoder.decode(bytes);
            } catch {
              continue;
            }
            if (/codexpro/i.test(text)) failures.push(`content:${file}`);
          }

          if (failures.length > 0) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Repository policy
        run: npm run policy:check

      - name: Focused rename contracts
        run: node --test test/codexgpt-contract.test.mjs test/codexgpt-inventory-contract.test.mjs test/codexgpt-self-test-contract.test.mjs test/auth-documentation.test.mjs test/package-contents.test.mjs test/operational-reliability.test.mjs

      - name: Package dry run
        run: npm pack --dry-run

      - name: Diff integrity
        run: git diff --check

      - name: Commit canonical rename
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No rename changes produced"; exit 1; }
          git commit -m "chore: rename project to CodexGPT"
          git push origin "HEAD:${GITHUB_REF_NAME}"
