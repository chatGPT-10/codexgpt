name: Apply STEP-371

on:
  push:
    branches:
      - fix/gate-x-execution-window-20260720
    paths:
      - .github/workflows/apply-step371.yml

permissions:
  contents: write

concurrency:
  group: apply-step371
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: fix/gate-x-execution-window-20260720
          fetch-depth: 0
      - name: Apply exact patch and publish
        run: |
          git apply --check .github/step371.patch
          git apply .github/step371.patch
          rm .github/step371.patch .github/workflows/apply-step371.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: publish detached runner finalization lease"
          git push origin HEAD:fix/gate-x-execution-window-20260720
